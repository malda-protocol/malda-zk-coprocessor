[package]
name = "malda_utils"
version = "0.1.0"
edition = "2021"

[features]
default = ["ssz"]
# Enable SSZ decoding support. Required for full ExecutionPayload decoding.
# Disable this feature for RISC-V zkVM targets where ethereum_hashing is not available.
ssz = ["dep:ssz_types", "dep:ethereum_ssz_derive", "dep:ethereum_ssz"]

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
risc0-steel = { workspace = true }
risc0-op-steel = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
eyre = { workspace = true }
snap = { workspace = true }
ssz_types = { workspace = true, optional = true }
ethereum_ssz_derive = { workspace = true, optional = true }
ethereum_ssz = { workspace = true, optional = true }
alloy-rlp = { workspace = true }
alloy-consensus = { workspace = true }
revm = { workspace = true }

# Linea block validation.
linea-block-verifier = { workspace = true }
