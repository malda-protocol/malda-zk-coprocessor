[package]
name = "guests"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "get-proof-data"
path = "src/bin/get_proof_data.rs"

[features]
default = ["testnet"]
mainnet = []
testnet = []

[workspace]

[dependencies]
alloy-primitives = { version = "1.3", default-features = false}
alloy-sol-types = { version = "1.3" }
risc0-steel = { git = "https://github.com/boundless-xyz/steel", tag = "v2.4.1" }
risc0-op-steel = { git = "https://github.com/boundless-xyz/steel", tag = "v2.4.1" }
risc0-zkvm = { version = "3.0.4", default-features = false, features = ['std', 'unstable'] }
malda_utils = { path = "../../malda_utils" }
alloy-consensus = "1.0"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
k256 = "0.13.4"
bls12_381 = "0.8.0"
c-kzg = { version = "=2.1.1", features = ["risc0-ffi"] }

# Linea block validation.
linea-block-verifier = { git = "https://github.com/malda-protocol/linea-block-verifier.git", tag = "v0.1.0", default-features = false, features = ["std"] }

[patch.crates-io]
ethereum_hashing = { path = "../../patch/ethereum_hashing" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1"  }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.0" }
c-kzg = { git = "https://github.com/risc0/c-kzg-4844.git", tag = "c-kzg/v2.1.1-risczero.0" }

[profile.release]
lto = "thin"
