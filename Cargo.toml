[workspace]
resolver = "2"
members = ["malda_rs", "methods", "malda_utils"]
exclude = ["lib"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
alloy-primitives = { version = "1.3", default-features = false, features = [
    "rlp",
    "serde",
    "std",
] }
alloy-sol-types = { version = "1.3" }
anyhow = { version = "1.0.75" }
bytemuck = { version = "1.16" }
hex = { version = "0.4" }
methods = { path = "./methods" }
risc0-build = { version = "3.0.4", features = ["docker", "unstable"] }
risc0-steel = { git = "https://github.com/boundless-xyz/steel", tag = "v2.4.1" }
risc0-op-steel = { git = "https://github.com/boundless-xyz/steel", tag = "v2.4.1" }
risc0-zkvm = { version = "3.0.4", default-features = false, features = ['unstable'] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
alloy = { version = "1.0", features = ["full"] }
alloy-consensus = "1.0"
alloy-rlp = "0.3.8"
k256 = { version = "0.13.3", features = ["arithmetic", "serde", "expose-field", "std", "ecdsa"] }
eyre = "0.6.8"
serde = { version = "1.0.143", features = ["derive"] }
url = "2.5"
snap = "1"
ssz_types = "0.11.0"
ethereum_ssz_derive = "0.9.0"
ethereum_ssz = "0.9.0"
revm = { version = "29.0", default-features = false }
futures = "0.3"
malda_utils = { path = "./malda_utils" }
malda_rs = { path = "./malda_rs" }

# Linea block validation.
linea-block-verifier = { git = "https://github.com/malda-protocol/linea-block-verifier.git", tag = "v0.1.0", default-features = false }
